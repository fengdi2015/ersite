<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Under Construction | Essential Rheumatology</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f8fa;
      color: #082f49;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background:
        radial-gradient(circle at 20% 15%, rgba(43, 173, 190, 0.12), transparent 34rem),
        linear-gradient(145deg, #f8fbfc, #eaf4f7);
    }

    main {
      width: min(100%, 42rem);
      padding: clamp(2.25rem, 7vw, 4.5rem) clamp(1.5rem, 7vw, 4rem);
      border: 1px solid rgba(8, 47, 73, 0.1);
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 1.5rem 4rem rgba(8, 47, 73, 0.12);
      text-align: center;
    }

    img {
      display: block;
      width: min(13rem, 70%);
      height: auto;
      margin: 0 auto 2rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3.25rem);
      line-height: 1.08;
      letter-spacing: -0.035em;
    }

    p {
      margin: 1rem 0 0;
      color: #486476;
      font-size: clamp(1rem, 3vw, 1.15rem);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <img src="images/logo-1.webp" alt="Essential Rheumatology">
    <h1>Website Under Construction</h1>
    <p>Please check back for future updates.</p>
  </main>
</body>
</html>
